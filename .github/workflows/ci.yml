name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install Linux sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          # Ubuntu 24.04's AppArmor policy disables unprivileged user
          # namespaces by default, including on GitHub's ephemeral runner.
          # Enable them so the real bubblewrap canary executes in CI.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Quality, tests, build, and distribution smoke
        run: bun run check
      - name: Compile release binaries and run host smoke test
        run: bun run build:bun:test
      - name: Validate checksums and archive layout
        run: bun run release:artifacts:check
