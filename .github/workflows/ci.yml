name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Quality, tests, build, and distribution smoke
        run: bun run check
      - name: Compile release binaries and run host smoke test
        run: bun run build:bun:test
      - name: Validate checksums and archive layout
        run: bun run release:artifacts:check
