name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to release
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate release tag and source
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "$expected" || {
            echo "tag $RELEASE_TAG does not match package version $expected" >&2
            exit 1
          }
          bun run check
      - name: Build and validate release artifacts
        run: |
          bun run build:bun:test
          bun run release:artifacts:check
      - name: Attest release archives
        uses: actions/attest@v4
        with:
          subject-path: dist-bun/*.tar.gz
      - name: Extract release notes
        run: |
          version="${RELEASE_TAG#v}"
          awk -v start="$version" '
            BEGIN { p=0 }
            $0 ~ ("^## " start " ") { p=1; next }
            p && /^## / { exit }
            p { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist-bun/*.tar.gz dist-bun/*.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" dist-bun/*.tar.gz dist-bun/*.sha256 \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
          fi
      - name: Preserve workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: summarize-${{ env.RELEASE_TAG }}
          path: |
            dist-bun/*.tar.gz
            dist-bun/*.sha256
          if-no-files-found: error
